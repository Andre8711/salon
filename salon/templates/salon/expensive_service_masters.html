<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Мастера, предоставляющие услуги дороже 3000 руб.</h1>
<ul>
  {% for master in masters %}
    <li>{{ master.first_name }} {{ master.last_name }} ({{ master.specialization }})</li>
  {% empty %}
    <li>Нет таких мастеров.</li>
  {% endfor %}
</ul>
</body>
</html>
