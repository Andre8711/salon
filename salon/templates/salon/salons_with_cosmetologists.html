<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Салоны с косметологами</h1>
<ul>
  {% for salon in salons %}
    <li>{{ salon.name }} — {{ salon.address }}</li>
  {% empty %}
    <li>Нет салонов с косметологами.</li>
  {% endfor %}
</ul>
</body>
</html>
