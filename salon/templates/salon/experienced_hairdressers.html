<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Опытные парикмахеры (опыт более 5 лет)</h1>
<ul>
  {% for master in masters %}
    <li>{{ master.name }} — опыт: {{ master.experience }} лет</li>
  {% empty %}
    <li>Нет опытных парикмахеров.</li>
  {% endfor %}
</ul>
</body>
</html>
