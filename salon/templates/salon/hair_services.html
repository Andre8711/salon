<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Услуги для волос</h1>
<ul>
  {% for service in services %}
    <li>{{ service.name }} — {{ service.price }} руб. ({{ service.duration }} мин)</li>
  {% empty %}
    <li>Нет услуг для волос.</li>
  {% endfor %}
</ul>
</body>
</html>
